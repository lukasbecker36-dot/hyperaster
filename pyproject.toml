[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperaster"
version = "0.1.0"
description = "Equity perps arbitrage: Hyperliquid <-> Aster DEX"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
